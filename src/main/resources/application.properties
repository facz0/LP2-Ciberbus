spring.application.name=ciberbus

# Server configuration
# If server.port is not specified, Spring Boot uses port 8080 by default.
server.port=8086

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
# Respeta exactamente el nombre de las columnas tal como están escritas en las entidades
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# MySQL database configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/prueba_agencia_bus?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=77506700

# Locale configuration
spring.web.locale=es_PE
spring.web.locale-resolver=fixed
