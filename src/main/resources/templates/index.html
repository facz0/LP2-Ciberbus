<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - CiberBus</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- CSS personalizado -->
    <link rel="stylesheet" th:href="@{/CSS/nav.css}">
    <link rel="stylesheet" th:href="@{/CSS/inicio.css}">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Fragmento del Navbar -->
    <div th:replace="~{fragments/nav :: menuNav}"></div>

    <!-- Carrusel de Banners -->
    <section>
       <div id="miCarrusel" class="carousel slide mt-3" data-bs-ride="carousel">
          <div class="carousel-indicators">
             <button type="button" data-bs-target="#miCarrusel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
             <button type="button" data-bs-target="#miCarrusel" data-bs-slide-to="1" aria-label="Slide 2"></button>
             <button type="button" data-bs-target="#miCarrusel" data-bs-slide-to="2" aria-label="Slide 3"></button>
          </div>
          <div class="carousel-inner rounded-4">
             <div class="carousel-item active">
                <img th:src="@{/imagenes/banner_inicio_01.png}" class="d-block w-100" alt="Destino 1">
             </div>
             <div class="carousel-item">
                <img th:src="@{/imagenes/banner_inicio_02.png}" class="d-block w-100" alt="Destino 2">
             </div>
             <div class="carousel-item">
                <img th:src="@{/imagenes/banner_inicio_03.png}" class="d-block w-100" alt="Destino 3">
             </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#miCarrusel" data-bs-slide="prev">
             <span class="carousel-control-prev-icon" aria-hidden="true"></span>
             <span class="visually-hidden">Anterior</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#miCarrusel" data-bs-slide="next">
             <span class="carousel-control-next-icon" aria-hidden="true"></span>
             <span class="visually-hidden">Siguiente</span>
          </button>
       </div>
    </section>

    <!-- Buscador de Pasajes -->
    <div class="container mb-4">
        <div class="card buscador-card border-0">
            <div class="card-body p-4 bg-white rounded-4">
                <h4 class="fw-bold mb-4 text-center" style="color: #4f699c;">
                    <i class="bi bi-search"></i> Busca tu próximo viaje
                </h4>
                
                <form id="formBusqueda" th:action="@{/inicio/buscarDestinos}" method="post">
                    <div class="row g-3 align-items-center">
                        
                        <!-- Selector de Origen -->
                        <div class="col-md-3">
                            <label class="form-label fw-bold" for="origenId">Origen</label>
                            <select class="form-select form-select-lg" name="origenId" id="origenId" onchange="buscarDestinos();">
                                <option value="">--Seleccione un origen--</option>
                                <option th:each="item : ${lst_ciudadesOrigen}"
                                        th:value="${item.idCiudad}"
                                        th:text="${item.departamento}"
                                        th:selected="${origenId != null and origenId == item.idCiudad}"><!-- Mantiene el origen al recargar -->
                                </option>
                            </select>
                        </div>
                        
                        <!-- Selector de Destino -->
                        <div class="col-md-3">
                            <label class="form-label fw-bold" for="rutaId">Destino</label>
                            <select class="form-select form-select-lg" name="rutaId" id="rutaId">
                                <option value="">Seleccione destino</option>
                                <option th:each="item : ${lst_ciudadesDestino}"
                                        th:value="${item.idRuta}"
                                        th:text="${item.ciudadLlegada.departamento}"
                                        th:selected="${rutaId != null and rutaId == item.idRuta}">
                                </option>
                            </select>
                        </div>
                        
                        <!-- Fecha de Viaje -->
                        <div class="col-md-3">
                            <label class="form-label fw-bold" for="fechaViaje">Fecha de viaje</label>
                            <input type="date" class="form-control form-control-lg" name="fechaViaje" id="fechaViaje" th:value="${fechaViaje}">
                        </div>
                        
                        <!-- Botón Buscar Pasajes -->
                        <div class="col-md-3 mt-auto">
                            <button type="button" class="btn btn-warning btn-lg w-100 fw-bold" onclick="buscarRutas();">
                                <i class="bi bi-bus-front-fill"></i> Buscar Pasajes
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Sección de Destinos Destacados -->
    <div class="container mt-5">
       <h2 class="text-center py-4 fw-bold" style="color: #4f699c;">¡Te llevamos a diferentes destinos!</h2>
       <div class="row">
          <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
             <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
                <img th:src="@{/imagenes/abancay.png}" class="card-img-top" alt="Abancay">
                <div class="card-body">
                   <p class="destino-label mb-0">Viaja a <span class="text-dark fw-bold">Abancay</span></p>
                   <small class="text-secondary">Saliendo de Lima</small>
                   <div class="d-flex justify-content-end mt-3">
                      <a th:href="@{/destino}" class="btn btn-outline-primary px-3">Ver más</a>
                   </div>
                </div>
             </div>
          </div>

          <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
             <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
                <img th:src="@{/imagenes/arequipa.png}" class="card-img-top" alt="Arequipa">
                <div class="card-body">
                   <p class="destino-label mb-0">Viaja a <span class="text-dark fw-bold">Arequipa</span></p>
                   <small class="text-secondary">Saliendo de Lima</small>
                   <div class="d-flex justify-content-end mt-3">
                      <a th:href="@{/destino}" class="btn btn-outline-primary px-3">Ver más</a>
                   </div>
                </div>
             </div>
          </div>

          <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
             <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
                <img th:src="@{/imagenes/ayacucho.png}" class="card-img-top" alt="Ayacucho">
                <div class="card-body">
                   <p class="destino-label mb-0">Viaja a <span class="text-dark fw-bold">Ayacucho</span></p>
                   <small class="text-secondary">Saliendo de Lima</small>
                   <div class="d-flex justify-content-end mt-3">
                      <a th:href="@{/destino}" class="btn btn-outline-primary px-3">Ver más</a>
                   </div>
                </div>
             </div>
          </div>

          <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
             <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
                <img th:src="@{/imagenes/Amazonas.png}" class="card-img-top" alt="Amazonas">
                <div class="card-body">
                   <p class="destino-label mb-0">Viaja a <span class="text-dark fw-bold">Amazonas</span></p>
                   <small class="text-secondary">Saliendo de Lima</small>
                   <div class="d-flex justify-content-end mt-3">
                      <a th:href="@{/destino}" class="btn btn-outline-primary px-3">Ver más</a>
                   </div>
                </div>
             </div>
          </div>
       </div>
    </div>

    <!-- Botón Ver Todos los Destinos -->
    <div class="container mt-4" style="margin-bottom: 120px;">
       <div class="row">
          <div class="col-12 text-center">
             <a th:href="@{/destino}"
                class="btn px-5 py-3 fw-bold shadow-sm"
                style="background-color: #4f699c; color: white; border-radius: 10px; border: none; display: inline-block; text-decoration: none;">
                VER TODOS LOS DESTINOS 
             </a>
          </div>
       </div>
    </div>

    <!-- Fragmento del Footer -->
    <div th:replace="~{fragments/footer :: piePagina}"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

    <script th:inline="javascript">
        function buscarDestinos() {
           const form = document.getElementById("formBusqueda");
           form.action = /*[[@{/inicio/buscarDestinos}]]*/ '/inicio/buscarDestinos';
           form.submit();
        }
        
        function buscarRutas() {
           if ($("#formBusqueda").valid()) {
              const form = document.getElementById("formBusqueda");
              form.action = /*[[@{/viajes/listar}]]*/ '/viajes/listar';
              form.submit();
           }
        }

        $(() => {
           $('#formBusqueda').validate({
              rules: {
                 origenId: { required: true },
                 rutaId: { required: true },
                 fechaViaje: { required: true }
              },
              messages: {
                 origenId: { required: 'Debe seleccionar el origen' },
                 rutaId: { required: 'Debe seleccionar el destino' },
                 fechaViaje: { required: 'Debe seleccionar la fecha de viaje' }
              },
              errorElement: "div",
              errorClass: "text-danger small mt-1",
              errorPlacement: function(error, element) {
                  error.insertAfter(element);
              }
           });
        });
    </script>
</body>
</html>
