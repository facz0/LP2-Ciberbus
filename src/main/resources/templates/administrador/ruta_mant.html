<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layouts/layout_admin :: layoutAdmin(~{::contenido})}">

<div th:fragment="contenido">

    <div class="text_center mb-5 mt-3">
        <h1 class="fw-bold">Página de mantenimiento de Rutas</h1>
    </div>

    <div class="row mb-3 align-items-center">
        <div class="col">
            <a href="#" class="btn btn-sm btn-outline-success" data-bs-toggle="modal" data-bs-target="#modalRuta" onclick="crear()">
                <i class="bi bi-map"></i> Agregar Ruta
            </a>
        </div>
    </div>

    <!-- Sección de Filtros estilo LP2 -->
    <div class="mb-4">
        <fieldset class="border border-2 border-secondary-subtle rounded-3 p-3 bg-light">
            <legend class="float-none w-auto px-2 fs-6 fw-bold text-secondary">
                <i class="bi bi-funnel-fill me-1"></i> Filtros de búsqueda
            </legend>
            <form th:action="@{/admin/rutas}" method="get">
                <div class="row g-2 align-items-end">
                    <div class="col-md-4">
                        <label for="filtroCiudadOrigen" class="form-label small fw-bold">Ciudad de Origen</label>
                        <div class="input-group input-group-sm">
                            <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                            <select class="form-select" id="filtroCiudadOrigen" name="idCiudadOrigen">
                                <option value="">-- Todos los orígenes --</option>
                                <option th:each="c : ${lst_ciudades}" 
                                        th:value="${c.idCiudad}" 
                                        th:text="${c.ciudad + ' (' + c.departamento + ')'}" 
                                        th:selected="${filter?.idCiudadOrigen == c.idCiudad}">Lima</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4 d-flex gap-2">
                        <button type="submit" class="btn btn-sm btn-outline-dark">
                            <i class="bi bi-search"></i> Buscar
                        </button>
                        <a th:href="@{/admin/rutas}" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-arrow-counterclockwise"></i> Limpiar
                        </a>
                    </div>
                </div>
            </form>
        </fieldset>
    </div>

    <table class="table table-striped table-sm mt-3">
        <thead>
            <tr>
                <th>Código</th>
                <th>Origen</th>
                <th>Destino</th>
                <th>Horas Estimadas</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(lst_rutas)}">
                <td colspan="6" class="text-center text-muted py-4">No se encontraron rutas registradas.</td>
            </tr>
            <tr th:each="item : ${lst_rutas}">
                <td th:text="${item.codigoRuta}">LIM-AQP</td>
                <td th:text="${item.ciudadPartida != null ? item.ciudadPartida.ciudad + ' (' + item.ciudadPartida.departamento + ')' : '-'}">Lima</td>
                <td th:text="${item.ciudadLlegada != null ? item.ciudadLlegada.ciudad + ' (' + item.ciudadLlegada.departamento + ')' : '-'}">Arequipa</td>
                <td th:text="${item.horasEstimadas != null ? item.horasEstimadas + ' hrs' : '-'}">14.50 hrs</td>
                <td>
                    <span class="badge" th:classappend="${item.estado == 1} ? 'text-bg-success' : 'text-bg-danger'"
                          th:text="${item.estado == 1 ? 'Habilitado' : 'Deshabilitado'}">Habilitado</span>
                </td>
                <td>
                    <div class="btn-group">
                        <button type="button" class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#modalRuta"
                                th:data-id="${item.idRuta}"
                                th:data-codigo="${item.codigoRuta}"
                                th:data-origen="${item.ciudadPartida != null ? item.ciudadPartida.idCiudad : ''}"
                                th:data-destino="${item.ciudadLlegada != null ? item.ciudadLlegada.idCiudad : ''}"
                                th:data-horas="${item.horasEstimadas}"
                                th:data-estado="${item.estado}"
                                onclick="editarRuta(this)">
                            <i class="bi bi-pencil-fill"></i>
                        </button>
                        <button type="button" class="btn btn-sm btn-danger"
                                th:onclick="|eliminar(${item.idRuta})|">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <form id="formEliminar" th:action="@{/admin/rutas/eliminar}" method="post">
        <input type="hidden" name="id">
    </form>

    <div class="modal fade" id="modalRuta" tabindex="-1" aria-labelledby="modalRutaLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header text-bg-primary">
                    <h1 class="modal-title fs-5" id="modalRutaLabel">Registrar Nueva Ruta</h1>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <form th:action="@{/admin/rutas/guardar}" method="POST">

                    <div class="modal-body">
                        <input type="hidden" id="idRuta" name="idRuta">

                        <div class="row">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Código de Ruta</label> 
                                <input type="text" class="form-control" id="codigoRuta" name="codigoRuta" required placeholder="Ej: LIM-AQP">
                            </div>							
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Ciudad Origen</label> 
                                <select class="form-select" id="idCiudadOrigen" name="ciudadPartida.idCiudad" required>
                                    <option value="">Seleccione un origen...</option>
                                    <option th:each="c : ${lst_ciudades}" 
                                            th:value="${c.idCiudad}" 
                                            th:text="${c.ciudad + ' (' + c.departamento + ')'}">Lima</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Ciudad Destino</label> 
                                <select class="form-select" id="idCiudadDestino" name="ciudadLlegada.idCiudad" required>
                                    <option value="">Seleccione un destino...</option>
                                    <option th:each="c : ${lst_ciudades}" 
                                            th:value="${c.idCiudad}" 
                                            th:text="${c.ciudad + ' (' + c.departamento + ')'}">Arequipa</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Horas Estimadas de Viaje</label> 
                                <input type="number" class="form-control" id="horasEstimadas" name="horasEstimadas" step="0.01" min="0.5" required placeholder="Ej: 14.50">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Estado</label> 
                                <select class="form-select" id="estado" name="estado">
                                    <option value="1">Habilitado</option>
                                    <option value="0">Deshabilitado</option>
                                </select>
                            </div>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-floppy"></i> Guardar Ruta
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        const eliminar = (id) => {
            const respuesta = confirm('¿Desea eliminar la ruta de forma permanente?');
            if (respuesta) {
                document.querySelector('#formEliminar input[name=id]').value = id;
                document.getElementById('formEliminar').submit();
            }
        };

        const crear = () => {
            document.querySelector('#modalRuta .modal-title').innerText = 'Registrar Nueva Ruta';
            document.querySelector('#idRuta').value = '';
            document.querySelector('#codigoRuta').value = '';
            document.querySelector('#idCiudadOrigen').value = ''; 
            document.querySelector('#idCiudadDestino').value = '';
            document.querySelector('#horasEstimadas').value = '';
            document.querySelector('#estado').value = '1'; 
        };

        const editarRuta = (btn) => {
            document.querySelector('#modalRuta .modal-title').innerText = 'Editar Ruta';
            document.querySelector('#idRuta').value = btn.getAttribute('data-id') || '';
            document.querySelector('#codigoRuta').value = btn.getAttribute('data-codigo') || '';
            document.querySelector('#idCiudadOrigen').value = btn.getAttribute('data-origen') || '';
            document.querySelector('#idCiudadDestino').value = btn.getAttribute('data-destino') || '';
            document.querySelector('#horasEstimadas').value = btn.getAttribute('data-horas') || '';
            document.querySelector('#estado').value = btn.getAttribute('data-estado') || '1';
        };
    </script>

</div>
</html>
