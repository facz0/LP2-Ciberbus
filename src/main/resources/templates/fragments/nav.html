<nav th:fragment="menuNav" class="navbar navbar-expand-lg navbar-dark sticky-top py-2">
    <div class="container">

        <!-- Logo con enlace al inicio -->
        <a class="navbar-brand py-0" th:href="@{/}">
            <img th:src="@{/imagenes/CiberUltimo.png}" style="height: 70px;"
                 alt="Logo CiberBus">
        </a>

        <!-- Botón responsive para móvil -->
        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse text-center" id="menu">

            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item px-lg-3">
                    <a class="nav-link fw-bold small"
                       th:href="@{/}">Inicio</a>
                </li>
                <li class="nav-item px-lg-3">
                    <a class="nav-link fw-bold small"
                       th:href="@{/destino}">Destinos</a>
                </li>
                <li class="nav-item px-lg-3">
                    <a class="nav-link fw-bold small"
                       th:href="@{/autogestion}">Autogestión</a>
                </li>
                <li class="nav-item px-lg-3">
                    <a class="nav-link fw-bold small"
                       th:href="@{/contacto}">Contacto</a>
                </li>
            </ul>

            <div class="d-flex justify-content-center mt-3 mt-lg-0">
                <a th:href="@{/admin/dashboard}" class="btn-profile text-light">
                    <i class="bi bi-person-circle fs-4"></i>
                </a>
            </div>

        </div>
    </div>
</nav>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const current = window.location.pathname;

        document.querySelectorAll('.nav-link').forEach(link => {
            const href = link.getAttribute('href');

            if (current.includes(href)) {
                link.classList.add('active');
            }
        });
    });
</script>
