<nav th:fragment="menuNav" class="navbar navbar-expand-lg navbar-dark sticky-top py-2">
    <div class="container">

        <!-- Logo con enlace al inicio -->
        <a class="navbar-brand py-0" th:href="@{/}">
            <img th:src="@{/imagenes/CiberUltimo.png}" style="height: 70px;"
                 alt="Logo CiberBus">
        </a>

        <!-- Botón responsive para móvil -->
        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse text-center" id="menu">

            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item px-lg-3">
                    <a class="nav-link fw-bold small"
                       th:href="@{/}">Inicio</a>
                </li>
                <li class="nav-item px-lg-3">
                    <a class="nav-link fw-bold small"
                       th:href="@{/destino}">Destinos</a>
                </li>
                <li class="nav-item px-lg-3">
                    <a class="nav-link fw-bold small"
                       th:href="@{/autogestion}">Autogestión</a>
                </li>
                <li class="nav-item px-lg-3">
                    <a class="nav-link fw-bold small"
                       th:href="@{/contacto}">Contacto</a>
                </li>
            </ul>

            <div class="d-flex align-items-center justify-content-center mt-3 mt-lg-0">
                <!-- Dropdown si el usuario ya inició sesión -->
                <div th:if="${session.usuario != null}" class="dropdown">
                    <button class="btn btn-outline-light btn-sm dropdown-toggle rounded-pill px-3 py-1 d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle fs-5"></i>
                        <span th:text="${session.usuario.nombre}">Usuario</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li th:if="${session.usuario.rol == 'ADMIN'}">
                            <a class="dropdown-item" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2 text-primary"></i>Panel Admin</a>
                        </li>
                        <li><a class="dropdown-item" th:href="@{/autogestion}"><i class="bi bi-ticket-perforated me-2 text-primary"></i>Mis Reservas</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión</a></li>
                    </ul>
                </div>

                <!-- Botón de login si no hay sesión -->
                <a th:if="${session.usuario == null}" th:href="@{/login}" class="btn-profile text-light" title="Iniciar Sesión / Administración">
                    <i class="bi bi-person-circle fs-4"></i>
                </a>
            </div>

        </div>
    </div>
</nav>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const current = window.location.pathname;

        document.querySelectorAll('.nav-link').forEach(link => {
            const href = link.getAttribute('href');

            if (current.includes(href)) {
                link.classList.add('active');
            }
        });
    });
</script>
