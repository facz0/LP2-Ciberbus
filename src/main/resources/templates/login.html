<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CiberBus</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, #001f3f 0%, #002147 50%, #001226 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            position: relative;
            padding: 2rem 1rem;
        }

        /* Efecto de sutiles partículas / círculos decorativos de fondo */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.25;
            pointer-events: none;
        }
        .shape-1 {
            width: 350px;
            height: 350px;
            background: #ffcc00;
            top: -50px;
            right: -50px;
        }
        .shape-2 {
            width: 400px;
            height: 400px;
            background: #0d6efd;
            bottom: -80px;
            left: -80px;
        }

        .login-card {
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.25rem;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
            background: #ffffff;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }

        .login-header {
            background-color: #002147;
            padding: 2rem 1.5rem 1.5rem;
            border-bottom: 3px solid #ffcc00;
        }

        .btn-ciberbus {
            background-color: #002147;
            border: 2px solid #002147;
            color: #ffffff;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-ciberbus:hover {
            background-color: #001733;
            border-color: #ffcc00;
            color: #ffcc00;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(0, 33, 71, 0.35);
        }

        .form-control:focus {
            border-color: #002147;
            box-shadow: 0 0 0 0.25rem rgba(0, 33, 71, 0.15);
        }

        .input-group-text {
            color: #6c757d;
        }

        .form-control:focus + .input-group-text,
        .input-group:focus-within .input-group-text {
            border-color: #002147;
            color: #002147;
        }

        .btn-volver {
            transition: all 0.25s ease;
            backdrop-filter: blur(5px);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        .btn-volver:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffcc00;
            border-color: #ffcc00;
        }
    </style>
</head>
<body>

    <!-- Círculos de luz ambiental de fondo -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <!-- Botón flotante para volver a la página principal -->
    <div class="position-absolute top-0 start-0 p-3 p-md-4 z-2">
        <a th:href="@{/}" class="btn btn-volver btn-sm rounded-pill px-3 py-2 d-inline-flex align-items-center gap-2 text-decoration-none">
            <i class="bi bi-arrow-left"></i>
            <span class="fw-semibold">Volver al Inicio</span>
        </a>
    </div>

    <!-- Contenedor de la Card de Login -->
    <div class="login-card">
        <!-- Encabezado con identidad de CiberBus -->
        <div class="login-header text-center">
            <a th:href="@{/}" class="d-inline-block mb-2">
                <img th:src="@{/imagenes/CiberUltimo.png}" alt="Logo CiberBus" style="height: 65px;" class="img-fluid">
            </a>
            <h4 class="text-white fw-bold mb-1">Acceso Administrativo</h4>
            <p class="text-white-50 small mb-0">Ingresá tus datos para ingresar al panel</p>
        </div>

        <!-- Cuerpo del formulario -->
        <div class="card-body p-4 p-sm-5">
            <!-- Bloque para mostrar toasts o sweet alerts generados desde el backend -->
            <th:block th:utext="${alert}"></th:block>

            <form th:action="@{/login}" method="post" id="formLogin" novalidate>
                <!-- Campo: Correo Electrónico -->
                <div class="mb-3">
                    <label for="correo" class="form-label fw-semibold text-secondary small">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" class="form-control bg-light border-start-0 ps-0" 
                               id="correo" name="correo" placeholder="admin@ciberbus.com" 
                               required autofocus value="admin@ciberbus.com">
                    </div>
                </div>

                <!-- Campo: Contraseña -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="clave" class="form-label fw-semibold text-secondary small mb-0">Contraseña</label>
                        <a href="javascript:void(0)" onclick="olvideClave()" class="text-decoration-none small text-muted">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" class="form-control bg-light border-start-0 border-end-0 px-0" 
                               id="clave" name="clave" placeholder="••••••••" required value="admin123">
                        <button class="btn btn-light border border-start-0 text-muted" type="button" id="btnToggleClave" title="Mostrar/ocultar contraseña">
                            <i class="bi bi-eye" id="iconoToggle"></i>
                        </button>
                    </div>
                </div>

                <!-- Checkbox Recordarme -->
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="recordarme" name="recordarme" checked>
                    <label class="form-check-label small text-muted" for="recordarme">Recordar mi sesión</label>
                </div>

                <!-- Botón de Ingreso -->
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-ciberbus btn-lg py-2 fs-6 fw-bold rounded-3 shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                    </button>
                </div>

                <!-- Tarjeta con Credenciales Demo -->
                <div class="alert alert-light border small text-muted text-center py-2 px-3 mb-0 rounded-3">
                    <div class="d-flex align-items-center justify-content-center gap-1 text-primary mb-1">
                        <i class="bi bi-shield-check"></i>
                        <strong class="small">Credenciales de prueba:</strong>
                    </div>
                    <div>
                        <span class="text-dark fw-bold">admin@ciberbus.com</span> / <span class="text-dark fw-bold">admin123</span>
                    </div>
                </div>
            </form>
        </div>

        <!-- Pie de la Card -->
        <div class="card-footer bg-light text-center py-3 border-0">
            <span class="text-muted small">&copy; 2026 CiberBus S.A.C. - Sistema Administrativo</span>
        </div>
    </div>

    <!-- Script para alternar visibilidad de contraseña y SweetAlert -->
    <script>
        const btnToggle = document.getElementById('btnToggleClave');
        const inputClave = document.getElementById('clave');
        const iconoToggle = document.getElementById('iconoToggle');

        if (btnToggle && inputClave && iconoToggle) {
            btnToggle.addEventListener('click', function () {
                if (inputClave.type === 'password') {
                    inputClave.type = 'text';
                    iconoToggle.classList.remove('bi-eye');
                    iconoToggle.classList.add('bi-eye-slash');
                } else {
                    inputClave.type = 'password';
                    iconoToggle.classList.remove('bi-eye-slash');
                    iconoToggle.classList.add('bi-eye');
                }
            });
        }

        function olvideClave() {
            Swal.fire({
                title: '¿Olvidaste tu contraseña?',
                text: 'Por cuestiones de seguridad, contactá al área de TI o soporte a admin@ciberbus.com para restablecer tu clave.',
                icon: 'info',
                confirmButtonText: 'Entendido',
                confirmButtonColor: '#002147'
            });
        }
    </script>
</body>
</html>
