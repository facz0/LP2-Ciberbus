<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Contacto - CiberBus</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<link rel="stylesheet" th:href="@{/CSS/nav.css}">
	<link rel="stylesheet" th:href="@{/CSS/inicio.css}">
</head>

<body class="d-flex flex-column min-vh-100">

	<div th:replace="~{fragments/nav :: menuNav}"></div>

	<section class="py-5 bg-light flex-grow-1">
		<div class="container">

			<div class="text-center mb-5">
				<h1 class="fw-bold display-4">Contáctanos</h1>
				<p class="lead text-secondary">Estamos aquí para ayudarte.
					Escríbenos y te responderemos lo antes posible.</p>
			</div>

			<div class="card border-0 shadow-lg rounded-4">
				<div class="card-body p-5">

					<h4 class="text-center fw-bold mb-4 text-uppercase">Contacta con nosotros</h4>

					<form id="formContacto" th:action="@{/contacto}" method="post">

						<div class="row g-4">

							<div class="col-md-6">
								<input type="text" class="form-control form-control-lg" name="nombre"
									placeholder="Nombre y Apellido" required>
							</div>

							<div class="col-md-6">
								<input type="email" class="form-control form-control-lg" name="correo"
									placeholder="Correo electrónico" required>
							</div>

							<div class="col-md-6">
								<input type="text" class="form-control form-control-lg" name="telefono"
									placeholder="Teléfono">
							</div>

							<div class="col-md-6">
								<input type="text" class="form-control form-control-lg" name="referente"
									placeholder="Asunto">
							</div>

							<div class="col-12">
								<textarea class="form-control form-control-lg" name="mensaje" rows="5"
									placeholder="Escribe tu mensaje..." required></textarea>
							</div>

							<div class="col-12 text-end">
								<button type="submit" class="btn btn-dark btn-lg px-5 shadow-sm">
									Enviar mensaje</button>
							</div>

						</div>

					</form>
				</div>
			</div>
		</div>
	</section>

	<div th:replace="~{fragments/footer :: piePagina}"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>

</body>

</html>
