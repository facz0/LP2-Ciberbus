<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Destinos - CiberBus</title>

	<!-- Bootstrap 5 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Bootstrap Icons -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<!-- CSS personalizado -->
	<link rel="stylesheet" th:href="@{/CSS/nav.css}">
	<link rel="stylesheet" th:href="@{/CSS/destino.css}">
</head>

<body class="d-flex flex-column min-vh-100">

	<!-- Fragmento del Navbar -->
	<div th:replace="~{fragments/nav :: menuNav}"></div>

	<!-- Banner Destino -->
	<section class="m-0 p-0">
		<img th:src="@{/imagenes/bannerDestino.png}" class="w-100 d-block banner-destino01" alt="Banner Destinos">
	</section>

	<main class="flex-grow-1">
		<section class="py-5 bg-light">
			<div class="container">

				<div class="text-center mb-5">
					<h2 class="titulo-destino fw-bold text-uppercase">Destinos</h2>
					<p class="text-muted">Explora los destinos más populares</p>
					<hr class="espacio mx-auto">
				</div>

				<!-- Lista dinámica de destinos con Thymeleaf -->
				<div class="row g-4">
					<div class="col-lg-3 col-md-4 col-sm-6" th:each="d, iterStat : ${destinos}">
						<!-- Iteración de destinos-->
						<div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
							<img th:src="@{'/imagenes/' + ${d.imagen}}" class="card-img-top" th:alt="${d.nombre}">
							<div class="card-body text-center d-flex flex-column">
								<p class="destino-label mb-1 text-secondary">
									Viaja a <span class="text-dark fw-bold" th:text="${d.nombre}">Ciudad</span>
								</p>


								<!--boton ventana emergente-->
								<button type="button"
									class="btn btn-outline-primary btn-sm px-4 mt-3 rounded-pill fw-bold"
									data-bs-toggle="modal" th:data-bs-target="'#modalDestino' + ${iterStat.index}">
									Ver más
								</button>
							</div>
						</div>

						<!--ventana emergente-->
						<div class="modal fade" th:id="'modalDestino' + ${iterStat.index}" tabindex="-1"
							aria-hidden="true">
							<div class="modal-dialog modal-dialog-centered">
								<div class="modal-content border-0 rounded-4 shadow">
									<div class="modal-header bg-primary text-white">
										<h5 class="modal-title fw-bold">
											<i class="bi bi-geo-alt-fill me-2"></i><span
												th:text="${d.nombre}">Destino</span>
										</h5>
										<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
											aria-label="Close"></button>
									</div>
									<div class="modal-body text-center p-4">
										<img th:src="@{'/imagenes/' + ${d.imagen}}"
											class="img-fluid rounded-3 mb-3 shadow-sm" th:alt="${d.nombre}"
											style="max-height: 200px; object-fit: cover; width: 100%;">
										<h6 class="fw-bold text-secondary mb-2">Acerca de este viaje:</h6>
										<p class="text-muted" th:text="${d.descripcion}">Descripción detallada del
											destino...</p>
									</div>
									<div class="modal-footer justify-content-center border-0 pb-4">
										<button type="button" class="btn btn-secondary rounded-pill px-4"
											data-bs-dismiss="modal">Cerrar</button>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

			</div>
		</section>
	</main>

	<!-- Fragmento del Footer -->
	<div th:replace="~{fragments/footer :: piePagina}"></div>

	<!-- Bootstrap 5 Bundle JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
